# Web app on Netlify (DECISIONS D29), continuous deploy from GitHub: production from `main`,
# branch deploys for allowed branches. Site base directory: apps/web. Set
# NEXT_PUBLIC_INDEXER_URL (and optionally ALCHEMY_API_KEY, NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID)
# in the site's environment.
[build]
  command = "pnpm --dir ../.. install --frozen-lockfile && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.4.0"
  NEXT_PUBLIC_CHAIN_ID = "11155111"
  # Chain reads use Tenderly's public gateway only (DECISIONS D31).
  NEXT_PUBLIC_RPC_URL = "https://sepolia.gateway.tenderly.co"
  RPC_URL = "https://sepolia.gateway.tenderly.co"

[[plugins]]
  package = "@netlify/plugin-nextjs"
