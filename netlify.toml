# Web app on Netlify (DECISIONS D29). Set NEXT_PUBLIC_INDEXER_URL (and optionally
# ALCHEMY_API_KEY, NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID, SENTRY_DSN) in the site's settings.
[build]
  base = "/"
  command = "pnpm --filter @market/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.4.0"
  NEXT_PUBLIC_CHAIN_ID = "11155111"
  # Chain reads use Tenderly's public gateway only (DECISIONS D31).
  NEXT_PUBLIC_RPC_URL = "https://sepolia.gateway.tenderly.co"
  RPC_URL = "https://sepolia.gateway.tenderly.co"
