[profile.default]
src = "src"
out = "out"
libs = []
allow_paths = ["../market"]
solc_version = "0.8.30"
evm_version = "prague"
via_ir = true
optimizer = true
optimizer_runs = 200
auto_detect_remappings = false
remappings = ["@openzeppelin/contracts/=../market/lib/openzeppelin-contracts/contracts/", "market/=../market/", "forge-std/=../market/lib/forge-std/src/"]
